[project]
name = "job-pipeline"
version = "0.1.0"
description = "Consolidated FastAPI job pipeline (discover, score, tailor, apply)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "applypilot==0.3.0",
    "playwright>=1.47",
    "google-auth>=2.35",
    "google-api-python-client>=2.150",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_pipeline"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

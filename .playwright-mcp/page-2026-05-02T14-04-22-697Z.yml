            - generic [ref=e90]:
              - paragraph [ref=e91]: Brahma delivers the “Media Business inside Every Business.” Born from the world’s most demanding industries—media, sports and entertainment—it merges 17 years of technology leadership with advanced agentic AI innovation. Evolving from the CLEAR® AI platform, Brahma is the category-defining creator platform for enterprise content, unifying creation, management and distribution into a single AI-powered supply chain. It enables organizations to meet skyrocketing content demand with speed, scale, security and ROI.
              - paragraph [ref=e92]: Inspired by its namesake creator in mythology, Brahma fuses Hollywood-grade technology with enterprise-scale AI innovation—turning raw data into dynamic video, audio and immersive content through purpose-built AI agents (e.g., Atman for digital humans, Vaani for multilingual lip-synced localization). It helps enterprises tell authentic, compliant, personalized and impactful stories globally.
              - paragraph [ref=e93]: Positioned at the center of a $400 billion shift toward audiovisual communication at scale, Brahma stands as a one-of-a-kind AI platform unifying content intelligence, creation and compliance. Backed by a global team and a growing portfolio of patents, it’s shaping the future of enterprise communication.
